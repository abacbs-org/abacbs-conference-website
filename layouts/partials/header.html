{{ $logo := resources.Get "abacbs-logo-clean.svg" }}
<nav class="header-nav" role="navigation" aria-label="Main navigation">
  <div class="header-content">
    <div class="header-logo">
      <a href="{{ site.Home.RelPermalink }}" class="logo-link logo-image-link" aria-label="Home - {{ site.Title }}">
        {{ if $logo }}
          <img src="{{ $logo.RelPermalink }}" alt="" class="header-brand-image">
        {{ end }}
      </a>
    </div>

    <button
      id="mobile-menu-toggle"
      class="mobile-menu-toggle"
      aria-label="{{ i18n "toggleMenu" }}"
      aria-controls="mobile-menu"
      aria-expanded="false"
      type="button">
      <span class="hamburger-icon">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </span>
    </button>

    <div class="header-menu">
      {{ partial "menu.html" (dict "page" .) }}
    </div>
  </div>
</nav>

<div id="mobile-menu" class="mobile-menu" aria-hidden="true">
  <div class="mobile-menu-overlay"></div>
  <nav class="mobile-menu-nav" aria-label="Mobile navigation">
    {{ partial "menu.html" (dict "page" . "mobile" true) }}
  </nav>
</div>

<script>
  (() => {
    const toggle = document.getElementById("mobile-menu-toggle");
    const header = toggle.closest(".sticky-header");
    header.addEventListener("focusout", (event) => {
      if (event.relatedTarget && !header.contains(event.relatedTarget) &&
          toggle.getAttribute("aria-expanded") === "true") {
        toggle.click();
      }
    });
  })();
</script>
